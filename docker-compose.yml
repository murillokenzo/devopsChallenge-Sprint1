services:
  db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASS}
      APP_USER: ${DB_USER}
      APP_USER_PASSWORD: ${DB_PASS}
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./init.sql:/container-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - rede-app

  api:
    build: .
    container_name: api-nuclear
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rede-app

networks:
  rede-app:

volumes:
  oracle_data:
